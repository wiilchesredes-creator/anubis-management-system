<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANUBIS BOX</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(#0f1117, #1a1d27);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: #1a1d27;
      border-radius: 20px;
      border: 3px solid #c9952a;
      box-shadow: 0 15px 40px rgba(201,149,42,0.4);
      width: 340px;
    }
    .container img {
      width: 140px;
      margin-bottom: 20px;
      filter: drop-shadow(0 0 15px #c9952a);
    }
    h1 {
      color: #c9952a;
      margin-bottom: 8px;
      font-size: 2rem;
    }
    p {
      color: #aaa;
      margin-bottom: 35px;
    }
    .btn {
      background: #c9952a;
      color: #000;
      padding: 16px 50px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: 0.3s;
    }
    .btn:hover {
      background: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="assets/logo.png" alt="Anubis Box">
    <h1>ANUBIS BOX</h1>
    <p>Panel de Administración</p>
    <a href="login.html" class="btn">🔑 INGRESAR AL SISTEMA</a>
  </div>
</body>
</html>
