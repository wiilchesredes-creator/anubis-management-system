<!DOCTYPE html>
<html lang="es">
<head>
  <script src="auth_guard.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/shared-utils.js"></script>
  <script src="js/api-utils.js"></script>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANUBIS BOX – Planes</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo.png">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
        header{background:#1a1d27;border-bottom:2px solid #c9952a;padding:0 32px;height:80px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
        .nav-left{grid-column:1;display:flex;align-items:center;gap:8px}
        .header-logo{grid-column:2;display:flex;justify-content:center;align-items:center}
        .header-logo img{height:64px;object-fit:contain}
        .menu-toggle{background:transparent;border:1px solid #2a2d3a;color:#aaa;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;gap:8px}
        .menu-toggle:hover{border-color:#c9952a;color:#c9952a}
        .sidebar{position:fixed;left:0;top:0;height:100%;width:260px;background:#0f1117;border-right:1px solid #2a2d3a;transform:translateX(-110%);transition:transform .25s ease;z-index:1001;padding:22px;display:flex;flex-direction:column;gap:8px}
        .sidebar.open{transform:translateX(0)}
        .sidebar .logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
        .sidebar .logo img{height:44px}
        .sidebar nav{display:flex;flex-direction:column;gap:4px;margin-top:12px}
        .sidebar a{color:#ccc;text-decoration:none;padding:10px 12px;border-radius:8px;display:flex;align-items:center;gap:8px}
        .sidebar a:hover{background:#1a1d27;color:#c9952a}
        .sidebar a.active{color:#c9952a;font-weight:600}
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s}
        .sidebar-overlay.show{opacity:1;pointer-events:auto}
        .container{max-width:1200px;margin:32px auto;padding:0 24px}
        .resumen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:28px}
        .metric{background:#1a1d27;border-radius:10px;padding:18px 20px;border:1px solid #2a2d3a;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,.4),0 0 18px rgba(201,149,42,.08);border-top:2px solid #c9952a;transition:transform .3s,box-shadow .3s;position:relative;cursor:pointer}
        .metric:hover{transform:translateY(-8px);box-shadow:0 2px 8px rgba(201,149,42,.4),0 8px 24px rgba(201,149,42,.25),0 16px 40px rgba(201,149,42,.12)}
        .metric::before{content:'';position:absolute;left:0;right:0;height:1px;top:8px;background:linear-gradient(90deg,transparent,rgba(201,149,42,.25),transparent)}
        .metric .lbl{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:1px}
        .metric .val{font-size:26px;font-weight:700;color:#c9952a;margin-top:6px}
        .card-title{color:#c9952a;font-size:14px;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px;font-weight:700}
        .planes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:32px;perspective:1000px}
        .plan-card{background:#1a1d27;border-radius:14px;border:1px solid #2a2d3a;overflow:hidden;transition:border-color .3s,box-shadow .3s,transform .3s;box-shadow:0 8px 16px rgba(0,0,0,.4),0 0 20px rgba(201,149,42,.08);transform:translateZ(0)}
        .plan-card:hover{border-color:#c9952a;box-shadow:0 2px 8px rgba(201,149,42,.4),0 8px 24px rgba(201,149,42,.25),0 16px 40px rgba(201,149,42,.15),inset 0 1px 0 rgba(201,149,42,.1);transform:translateY(-8px) translateZ(20px)}
        .plan-card.top-plan{border-color:#c9952a;box-shadow:0 0 0 1px rgba(201,149,42,.45),0 8px 24px rgba(201,149,42,.25),0 0 34px rgba(201,149,42,.18);position:relative}
        .plan-card.top-plan::after{content:'Más inscritos';position:absolute;top:12px;right:12px;background:#c9952a;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;z-index:2}
        .plan-header{background:linear-gradient(135deg,#1f2233 0%,#252840 50%,#1f2233 100%);padding:24px;border-bottom:2px solid #c9952a;position:relative;overflow:hidden}
        .plan-header::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(201,149,42,.1) 0%,transparent 70%);animation:shimmer 6s infinite}
        @keyframes shimmer{0%{transform:translate(0,0)}50%{transform:translate(10px,10px)}100%{transform:translate(0,0)}}
        .plan-nombre{font-size:20px;font-weight:900;color:#c9952a;margin-bottom:8px;text-transform:uppercase;letter-spacing:1.5px;text-shadow:0 2px 8px rgba(201,149,42,.3);position:relative;z-index:1}
        .plan-descripcion{font-size:14px;color:#ddd;line-height:1.6;margin-bottom:16px;max-height:5.6em;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
        .plan-meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
        .plan-valor{font-size:24px;font-weight:700;color:#e0e0e0}
        .plan-duracion{font-size:12px;color:#555;text-align:right}
        .plan-creditos{font-size:12px;color:#bbb;margin-top:10px}
        .plan-duracion span{display:block;font-size:18px;font-weight:700;color:#aaa}
        .plan-counter{display:flex;align-items:center;gap:8px;padding:12px 24px;border:0;border-bottom:1px solid #2a2d3a;background:#141620;width:100%;cursor:pointer;text-align:left;transition:background .2s}
        .plan-counter:hover{background:#1f2231}
        .counter-num{font-size:24px;font-weight:700;color:#c9952a}
        .counter-label{font-size:12px;color:#555}
        .plan-toggle{width:100%;background:transparent;border:none;border-top:1px solid #2a2d3a;padding:10px 24px;color:#555;font-size:12px;cursor:pointer;text-align:left;transition:all .2s;display:flex;align-items:center;gap:6px}
        .plan-toggle:hover{color:#c9952a;background:#1f2231}
        .plan-lista{display:none}
        .plan-lista.show{display:block}
        .plan-clientes{padding:0}
        .cliente-item{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;border-bottom:1px solid #1a1d27;transition:background .15s}
        .cliente-item:last-child{border-bottom:none}
        .cliente-item:hover{background:#1f2231}
        .cliente-info{display:flex;flex-direction:column;gap:2px}
        .cliente-nombre{font-size:13px;font-weight:600;color:#e0e0e0}
        .cliente-detalle{font-size:11px;color:#555}
        .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
        .badge-activo{background:linear-gradient(135deg,#c9952a 0%,#d4a43a 100%);color:#000;box-shadow:0 4px 12px rgba(201,149,42,.3);font-weight:700;display:inline-flex;align-items:center;gap:4px}
        .badge-activo::before{content:'⊙';font-size:14px;font-weight:900}
        .badge-inactivo{background:#3a1a1a;color:#f87171}
        .badge-suspendido{background:#3a2a00;color:#f0c060}
        .plan-empty{padding:20px 24px;text-align:center;color:#444;font-size:13px}
        .empty-state{text-align:center;color:#444;padding:60px;font-size:14px}
        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;align-items:center;justify-content:center;padding:24px}
        .modal-overlay.show{display:flex}
        .modal{background:#1a1d27;border:1px solid #2a2d3a;border-radius:14px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 48px rgba(0,0,0,.7);border-top:2px solid #c9952a}
        .modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #2a2d3a}
        .modal-header h3{color:#c9952a;font-size:15px;text-transform:uppercase;letter-spacing:1px}
        .modal-close{background:transparent;border:none;color:#777;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1}
        .modal-close:hover{background:#2a2d3a;color:#fff}
        .modal-content{padding:20px 24px;overflow-y:auto}
        .modal-content::-webkit-scrollbar{width:6px}
        .modal-content::-webkit-scrollbar-track{background:#1a1d27}
        .modal-content::-webkit-scrollbar-thumb{background:#2a2d3a;border-radius:3px}
        .modal-content::-webkit-scrollbar-thumb:hover{background:#3a3d4a}
        .modal-footer{display:flex;justify-content:flex-end;padding:16px 24px;border-top:1px solid #2a2d3a}
        .btn-close{background:#2a2d3a;color:#ccc;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:600}
        .btn-close:hover{background:#3a3d4a;color:#fff}
        .modal-table{width:100%;border-collapse:collapse;font-size:13px}
        .modal-table th{color:#888;font-size:11px;text-align:left;padding:10px 12px;border-bottom:1px solid #2a2d3a;text-transform:uppercase;letter-spacing:1px}
        .modal-table td{padding:10px 12px;border-bottom:1px solid #1f2231}
        .modal-total{margin-top:16px;background:#0f1117;border:1px solid #c9952a;border-radius:10px;padding:14px 16px;color:#f8e7b2;font-weight:700;text-align:right}
        .metric.clickable{cursor:pointer}
    </style>
</head>
<body>

<header>
    <div class="nav-left">
        <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú">☰</button>
    </div>
    <div class="header-logo"><img src="assets/logo.png" alt="ANUBIS BOX"></div>
<div style="grid-column:3;display:flex;justify-content:flex-end;align-items:center;gap:12px">
    <span id="adminNombre" style="font-size:12px;color:#888"></span>
    <a href="logout.php"
       style="background:transparent;border:2px solid #c9952a;color:#c9952a;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;letter-spacing:.5px;transition:all .2s"
       onmouseover="this.style.background='rgba(201,149,42,.15)';this.style.boxShadow='0 0 12px rgba(201,149,42,.3)'"
       onmouseout="this.style.background='transparent';this.style.boxShadow='none'">
      🚪 Cerrar sesión
    </a>
  </div>
</header>

<aside class="sidebar" id="sidebar">
    <div class="logo"><img src="assets/logo.png" alt="ANUBIS BOX"><strong style="color:#c9952a">ANUBIS BOX</strong></div>
    <nav>
        <a href="index.html">👥 Clientes</a>
        <a href="planes.html" class="active">📋 Planes</a>
        <a href="membresias.html">📦 Membresías</a>
        <a href="tienda.html">🛒 Tienda</a>
        <a href="finanzas.html">💰 Finanzas</a>
    <a href="asistencia.html">✅ Asistencia</a>
    <a href="horarios.html">🕐 Horarios</a>
    </nav>
</aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="container">
    <div class="resumen-grid" id="resumen">
        <div class="metric"><div class="lbl">Cargando</div><div class="val">—</div></div>
    </div>
    <p class="card-title">📋 Planes y clientes inscritos</p>
    <div class="planes-grid" id="planesGrid">
        <div class="empty-state">Cargando planes...</div>
    </div>
</div>

<div class="modal-overlay" id="clientesModal" onclick="cerrarModalClientesSiOverlay(event)">
    <div class="modal">
        <div class="modal-header">
            <h3 id="clientesModalTitle">Clientes inscritos</h3>
            <button class="modal-close" onclick="cerrarModalClientes()">×</button>
        </div>
        <div class="modal-content" id="clientesModalContent"></div>
        <div class="modal-footer"><button class="btn-close" onclick="cerrarModalClientes()">Cerrar</button></div>
    </div>
</div>

<div class="modal-overlay" id="ingresosModal" onclick="cerrarModalIngresosSiOverlay(event)">
    <div class="modal">
        <div class="modal-header">
            <h3>Ingresos estimados</h3>
            <button class="modal-close" onclick="cerrarModalIngresos()">×</button>
        </div>
        <div class="modal-content" id="ingresosModalContent"></div>
        <div class="modal-footer"><button class="btn-close" onclick="cerrarModalIngresos()">Cerrar</button></div>
    </div>
</div>

<script>
    const API = 'api';
    let planesData = [];

    function peso(n) {
      return '$' + Number(n || 0).toLocaleString('es-CO');
    }

    function abrirModalClientes(id) {
      const plan = planesData.find(p => Number(p.id) === Number(id));
      if (!plan) return;
      document.getElementById('clientesModalTitle').textContent = `Clientes inscritos - ${plan.nombre}`;
      document.getElementById('clientesModalContent').innerHTML = plan.clientes.length
        ? `<table class="modal-table">
            <thead><tr><th>Nombre</th><th>Cédula</th></tr></thead>
            <tbody>
              ${plan.clientes.map(c => `<tr><td>${c.nombre || '—'}</td><td>${c.cedula || '—'}</td></tr>`).join('')}
            </tbody>
          </table>`
        : '<div class="plan-empty">Sin clientes inscritos aún</div>';
      document.getElementById('clientesModal').classList.add('show');
    }

    function cerrarModalClientes() { document.getElementById('clientesModal').classList.remove('show'); }
    function cerrarModalClientesSiOverlay(e) { if (e.target === document.getElementById('clientesModal')) cerrarModalClientes(); }

    function abrirModalIngresos() {
      const total = planesData.reduce((s, p) => s + (Number(p.total_clientes || 0) * Number(p.valor || 0)), 0);
      document.getElementById('ingresosModalContent').innerHTML = `
        <div class="plan-empty" style="padding:0 0 16px;text-align:left;color:#888">El total se calcula multiplicando los clientes inscritos de cada plan por el valor individual del plan.</div>
        <table class="modal-table">
          <thead><tr><th>Plan</th><th>Clientes</th><th>Valor</th><th style="text-align:right">Subtotal</th></tr></thead>
          <tbody>
            ${planesData.map(p => {
              const clientes = Number(p.total_clientes || 0);
              const valor = Number(p.valor || 0);
              const subtotal = clientes * valor;
              return `<tr>
                <td>${p.nombre}</td>
                <td>${clientes}</td>
                <td>${peso(valor)}</td>
                <td style="text-align:right;font-weight:700;color:#c9952a">${peso(subtotal)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        <div class="modal-total">Total estimado: ${peso(total)}</div>
      `;
      document.getElementById('ingresosModal').classList.add('show');
    }

    function cerrarModalIngresos() { document.getElementById('ingresosModal').classList.remove('show'); }
    function cerrarModalIngresosSiOverlay(e) { if (e.target === document.getElementById('ingresosModal')) cerrarModalIngresos(); }

    async function cargarPlanes() {
      try {
        const data = await (await fetch(`${API}/planes.php`)).json();
        planesData = data;
        const activos = data.filter(p => parseInt(p.activo) === 1);
        const totalClientes  = activos.reduce((s,p) => s + p.total_clientes, 0);
        const totalEstimado  = activos.reduce((s,p) => s + (p.total_clientes * parseFloat(p.valor)), 0);
        const planTop        = activos.reduce((a,b) => a.total_clientes >= b.total_clientes ? a : b, {nombre:'—',total_clientes:0});
        const maxClientes = Math.max(...activos.map(p => Number(p.total_clientes || 0)), 0);

        document.getElementById('resumen').innerHTML = `
          <div class="metric"><div class="lbl">Total planes</div><div class="val">${activos.length}</div></div>
          <div class="metric"><div class="lbl">Total clientes</div><div class="val">${totalClientes}</div></div>
          <div class="metric"><div class="lbl">Plan más popular</div><div class="val" style="font-size:16px">${planTop.nombre}</div></div>
          <div class="metric clickable" onclick="abrirModalIngresos()"><div class="lbl">Ingresos estimados</div><div class="val" style="font-size:18px">${peso(totalEstimado)}</div></div>
        `;

        if (!activos.length) {
          document.getElementById('planesGrid').innerHTML = '<div class="empty-state">No hay planes registrados</div>';
          return;
        }

        document.getElementById('planesGrid').innerHTML = data.filter(plan => parseInt(plan.activo) === 1).map(plan => {
          const topClass = maxClientes > 0 && Number(plan.total_clientes || 0) === maxClientes ? ' top-plan' : '';

          return `
            <div class="plan-card${topClass}">
              <div class="plan-header">
                <div class="plan-nombre">${plan.nombre}</div>
                <div class="plan-descripcion">${plan.descripcion||'Sin descripción'}</div>
                <div class="plan-meta">
                  <div class="plan-valor">${peso(plan.valor)}</div>
                  <div class="plan-duracion"><span>${plan.duracion_dias}</span>días de vigencia</div>
                </div>
                <div class="plan-creditos">Créditos mes: ${plan.creditos_mes ? plan.creditos_mes : '—'}</div>
              </div>
              <button class="plan-counter" onclick="abrirModalClientes(${plan.id})">
                <span class="counter-num">${plan.total_clientes}</span>
                <span class="counter-label">cliente${plan.total_clientes!==1?'s':''} inscrito${plan.total_clientes!==1?'s':''}</span>
              </button>
            </div>`;
        }).join('');

      } catch(e) {
        document.getElementById('planesGrid').innerHTML = '<div class="empty-state">No se pudo conectar. Abre desde http://localhost/anubisbox/</div>';
      }
    }

    /* Funciones toggleSidebar() y closeSidebar() ahora en shared-utils.js */

    document.addEventListener('DOMContentLoaded', () => {
      // Event listeners para sidebar se inicializan automáticamente en shared-utils.js
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        cerrarModalClientes();
        cerrarModalIngresos();
        closeSidebar();
      }
    });
    cargarPlanes();
</script>
</body>
</html>
